<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System</title>
    <style>
        /* Modern, Clean Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Form Styling */
        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eef2f3;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3498db;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .btn-add {
            background-color: #2ecc71;
            color: white;
            align-self: flex-end;
            height: 40px;
        }

        .btn-add:hover {
            background-color: #27ae60;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eef2f3;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>🎓 Student Record System</h1>

    <div class="container">
        <!-- Input Form -->
        <form id="studentForm">
            <div class="form-group">
                <label for="rollNo">Roll Number</label>
                <input type="text" id="rollNo" required placeholder="e.g. 101">
            </div>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="e.g. Alice Smith">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="e.g. alice@example.com">
            </div>
            <div class="form-group">
                <label for="grade">Grade / Marks</label>
                <input type="text" id="grade" required placeholder="e.g. A+ or 95%">
            </div>
            <button type="submit" class="btn-add">Add Student</button>
        </form>

        <!-- Records Display Table -->
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>Roll Number</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dynamic rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        // Array to hold student objects in runtime memory
        let students = [];

        const studentForm = document.getElementById('studentForm');
        const tableBody = document.getElementById('tableBody');

        // Initial setup execution
        updateTable();

        // Handle form submission
        studentForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevents page reload

            // Extract input values
            const rollNo = document.getElementById('rollNo').value.trim();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const grade = document.getElementById('grade').value.trim();

            // Validation: Prevent duplicate Roll Numbers
            const isDuplicate = students.some(student => student.rollNo === rollNo);
            if (isDuplicate) {
                alert('A student with this Roll Number already exists!');
                return;
            }

            // Create new record object
            const newStudent = { rollNo, name, email, grade };

            // Add to array and update UI
            students.push(newStudent);
            updateTable();

            // Clear input fields
            studentForm.reset();
        });

        // Function to clear and re-render the HTML table table from the array
        function updateTable() {
            tableBody.innerHTML = ''; // Reset UI view

            if (students.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="no-data">No student records found. Add one above!</td></tr>`;
                return;
            }

            students.forEach((student, index) => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td><b>${student.rollNo}</b></td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.grade}</td>
                    <td><button class="btn-delete" onclick="deleteStudent(${index})">Delete</button></td>
                `;

                tableBody.appendChild(row);
            });
        }

        // Function to remove a record
        window.deleteStudent = function(index) {
            if (confirm('Are you sure you want to delete this record?')) {
                students.splice(index, 1); // Remove from array
                updateTable(); // Re-render UI
            }
        };
    </script>

</body>
</html>
