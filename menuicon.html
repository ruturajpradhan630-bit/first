<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Sidebar Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #1E293B;
    }
    .menu-icon {
      font-size: 19px;
      cursor: pointer;
      display: inline-block;
      padding: 10px;
      background: #007bff;
      color: white;
      border-radius: 5px;
      user-select: none;
      width:70px;
      height:30px;
    } 
    .menu-icon:hover{
      background-color:#2e7a87;
    }
    .sidebar {
      height: 100%;
      width: 150px;         /* Width of the sidebar */
      position: fixed;      /* Stays in place when scrolling */
      top: 0;
      left: -250px;        /* Hidden off-screen by default */
      background-color: #111;
      padding-top: 60px;
      transition: 0.3s;     /* Smooth slide-in effect */
      box-shadow: 2px 0px 5px rgba(0,0,0,0.5);
    }

    /* Sidebar Links */
    .sidebar a {
      padding: 15px 25px;
      text-decoration: none;
      font-size: 18px;
      color: #818181;
      display: block;       /* Stack links vertically */
      transition: 0.2s;
    }

    /* Hover effect for links */
    .sidebar a:hover {
      color: #f1f1f1;
      background-color: #575757;
    }

    /* Close Button inside Sidebar */
    .sidebar .close-btn {
      position: absolute;
      top: 10px;
      right: 25px;
      font-size: 36px;
      color: #818181;
      cursor: pointer;
    }

    /* 3. ACTIVE CLASS (Triggers via JavaScript) */
    .sidebar.open {
      left: 0;             /* Slides the sidebar into view */
    }
  </style>
</head>
<body>

  <!-- Menu Icon (Hamburger) -->
  <div class="menu-icon" onclick="toggleSidebar()">&#9776; Menu</div>

  <!-- Sidebar Framework -->
  <div id="mySidebar" class="sidebar">
    <!-- Close Button -->
    <span class="close-btn" onclick="toggleSidebar()">&times;</span>
    
    <!-- Navigation Options -->
    <a href="home.html">Home</a>
    <a href="services.html">Services</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- JavaScript to handle click actions -->
  <script>
    function toggleSidebar() {
      var sidebar = document.getElementById("mySidebar");
      
      // If sidebar has 'open' class, remove it. Otherwise, add it.
      sidebar.classList.toggle("open");
    }
  </script>

</body>
</html>
